# Tool configuration only. Runtime dependencies stay in requirements.txt
# (this is an application, not an installable package, so there is no
# [project] table here).
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

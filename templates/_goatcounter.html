     page-view counts — no cookies, no personal data. One async script;
     it reports the page view and referrer to the dashboard. The src is
     explicit https (not protocol-relative) so the script loads over
     HTTPS even if the page is ever served over plain HTTP.
     This is the jpl-dev site — NOT the whenwherebiz site; each domain
     gets its own GoatCounter site because GoatCounter records the path
     only, not the domain. -->

        async src="https://gc.zgo.at/count.js"></script>

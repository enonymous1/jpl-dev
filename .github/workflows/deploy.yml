name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual re-deploys without requiring a new commit (A2d)
  workflow_dispatch:

# Add permissions for GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # Regenerate the purged + minified Tailwind CSS for Schedule Maker.
    # The Play CDN (cdn.tailwindcss.com) is NOT for production — it ships
    # a ~3MB runtime compiler with no SRI hash. CLI output is ~20KB. (E5a/E5b)
    - name: Generate Tailwind CSS
      run: |
        npx --yes tailwindcss@3 \
          -c projects/schedule_maker/tailwind.config.js \
          -i projects/schedule_maker/tailwind.input.css \
          -o static/projects/schedule_maker/tailwind.css \
          --minify

    - name: Generate static site
      run: |
        python freeze.py
        
    # CNAME must be injected AFTER freeze.py runs and BEFORE the artifact is
    # uploaded. freeze.py (FREEZER_REMOVE_EXTRA_FILES=True) would delete any
    # CNAME written earlier; the deploy step consumes the artifact, not docs/
    # directly, so writing CNAME after upload would have no effect. (A2a)
    # The canonical CNAME value lives in the repo-root CNAME file. (A2b)
    - name: Add CNAME file
      run: cp CNAME docs/CNAME
        
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs

    # Build and freeze run on every push/PR for validation.
    # Deployment to GitHub Pages is gated to pushes on main only. (A2c)
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      if: github.ref == 'refs/heads/main'

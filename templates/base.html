<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} - JPL-DEV</title>
    <meta name="description" content="Justin P. Lyons — portfolio, projects and tools, built with Flask and Tailwind CSS and deployed as a static site.">
    <meta property="og:title" content="JPL-DEV — Justin P. Lyons">
    <meta property="og:description" content="Portfolio, projects and tools by Justin P. Lyons.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://justinlyons.dev/">

    <!-- Bootstrap Icons (icon font only; Bootstrap CSS itself was removed) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet"
          integrity="sha384-DeN988K4Vg0cDrUgVHjrVM0+ogMrXsv0AZYIH40/9VGpjC7zi8TFGdnPwL1EkU/T" crossorigin="anonymous">

    <!-- Tailwind CSS (built via CLI; see tailwind.config.js + static/css/tailwind.input.css) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">

    <!-- Custom CSS (theme variables, typography, project-specific) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile-card.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/checklist.css') }}">

    <!-- Flash the correct theme before first paint to prevent flicker -->
    <script>
        (function() {
            try {
                const saved = window.localStorage.getItem('jpl_dev_global_theme');
                const sys = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                const theme = saved || sys;
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>

    {% block head %}{% endblock %}
</head>
<body>
    <!-- ── Navigation ─────────────────────────────────────────────────────── -->
    <!-- Nav colors come from --nav-* variables so light and dark themes
         share one header. The public nav is Home, Projects, GitHub; the
         internal demo route still exists but is no longer linked here. -->
    <nav class="sticky top-0 z-50 shadow-md" style="background:var(--nav-bg);color:var(--nav-text-active)" id="main-navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">

                <!-- Brand + mobile hamburger -->
                <div class="flex items-center gap-3">
                    <button id="nav-toggle"
                            class="lg:hidden p-1.5 rounded transition-colors"
                            style="color:var(--nav-text)"
                            aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-menu">
                        <i class="bi bi-list text-xl"></i>
                    </button>
                    <a class="font-bold text-lg flex items-center gap-2 transition-colors no-underline"
                       style="color:var(--nav-text-active)"
                       href="{{ url_for('index') }}">
                        <i class="bi bi-code-square"></i>JPL-DEV
                    </a>
                </div>

                <!-- Desktop nav links -->
                <div class="hidden lg:flex items-center gap-1">
                    <a class="px-3 py-2 rounded text-sm font-medium transition-colors no-underline"
                       style="{% if request.endpoint == 'index' %}background:var(--nav-active-bg);color:var(--nav-text-active){% else %}color:var(--nav-text){% endif %}"
                       href="{{ url_for('index') }}">
                        <i class="bi bi-house-door mr-1"></i>Home
                    </a>
                    <a class="px-3 py-2 rounded text-sm font-medium transition-colors no-underline"
                       style="color:var(--nav-text)"
                       href="https://github.com/enonymous1" target="_blank" rel="noopener noreferrer">
                        <i class="bi bi-github mr-1"></i>GitHub
                    </a>
                </div>

                <!-- Right: page-specific actions + theme toggle -->
                <div class="flex items-center gap-1">
                    <!-- Theme toggle -->
                    <button id="theme-toggle" type="button"
                            class="p-1.5 rounded transition-colors"
                            style="color:var(--nav-text)"
                            title="Toggle theme" aria-label="Toggle theme" aria-pressed="false">
                        <i class="bi bi-sun theme-icon-light"></i>
                        <i class="bi bi-moon theme-icon-dark hidden"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile nav menu (collapsed by default) -->
        <div id="nav-menu" class="hidden lg:hidden border-t" style="background:var(--nav-bg);border-color:var(--nav-border)">
            <div class="px-4 py-2 space-y-0.5">
                <a class="flex items-center gap-2 px-3 py-2 rounded text-sm font-medium transition-colors no-underline"
                   style="{% if request.endpoint == 'index' %}background:var(--nav-active-bg);color:var(--nav-text-active){% else %}color:var(--nav-text){% endif %}"
                   href="{{ url_for('index') }}">
                    <i class="bi bi-house-door"></i>Home
                </a>
                <a class="flex items-center gap-2 px-3 py-2 rounded text-sm font-medium transition-colors no-underline"
                   style="color:var(--nav-text)"
                   href="https://github.com/enonymous1" target="_blank" rel="noopener noreferrer">
                    <i class="bi bi-github"></i>GitHub
                </a>
            </div>
        </div>
    </nav>

    <!-- ── Main content ────────────────────────────────────────────────────── -->
    <main>
        {% block content %}{% endblock %}
    </main>

    {% block footer %}{% endblock %}

    <!-- Global scripts -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='global-theme.js') }}"></script>
    {% block scripts %}{% endblock %}

    <!-- Mobile nav toggle (vanilla JS, no framework required) -->
    <script>
        document.getElementById('nav-toggle')?.addEventListener('click', function () {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('hidden');
            this.setAttribute('aria-expanded', String(!menu.classList.contains('hidden')));
        });
    </script>

</body>
</html>

# Tool configuration only. Runtime dependencies stay in requirements.txt
# (this is an application, not an installable package, so there is no
# [project] table here).
[tool.ruff]
line-length = 100
# Markdown is excluded on purpose: ruff format rewrites code blocks
# inside docs (alignment, quote style), and docs should not fail CI
# over formatter style. Only Python is format-checked.
exclude = ["*.md"]
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# E/F/I are the baseline; B (bugbear) catches real bugs (mutable
# defaults, unused loop variables, f-string placeholders) and UP
# (pyupgrade) keeps syntax at the py311 floor. Both are low-noise here.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The scripts/ modules are first-party code (pytest puts scripts/ on
# sys.path), but ruff only auto-detects top-level modules, so without
# this it files freeze/fetch_repos/new_post under third-party and the
# import order in tests/test_freeze.py fails I001. app/ and config/
# are top-level, so ruff finds those on its own.
known-first-party = ["freeze", "fetch_repos", "new_post"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root and scripts/ on sys.path for every pytest invocation, not
# just "python -m pytest" (which adds cwd implicitly). Bare "pytest" —
# what CI runs — otherwise cannot import app.py / freeze.py /
# fetch_repos.py (the last two live in scripts/).
pythonpath = [".", "scripts"]

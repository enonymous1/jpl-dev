<!-- Avatar play modal, shared by the homepage and the blog post pages:
     both render the sidebar include, whose photo button opens this
     dialog after 10 clicks within 3 seconds. The photo is the same
     sidebar image at a larger size; the script (avatar-easter-egg.js)
     owns the stretch interaction, so this partial is markup only.
     draggable="false" keeps the browser's native image drag from
     fighting the pointer-drag stretch. -->
<div id="avatar-play-modal" class="repo-modal" hidden>
    <div class="repo-modal-backdrop" data-avatar-play-close></div>
    <div class="repo-modal-card avatar-play-card" role="dialog" aria-modal="true" aria-label="Stretch the photo">
        <button type="button" id="avatar-play-close" class="repo-modal-close" data-avatar-play-close aria-label="Close photo">&times;</button>
        <p class="repo-modal-kicker">Easter egg</p>
        <img id="avatar-play-photo" class="avatar-play-photo" src="{{ url_for('static', filename=about.profile_image) }}" alt="Profile photo of Justin P. Lyons" draggable="false">
        <p class="avatar-play-hint">Drag the photo to stretch it &mdash; let go and it springs back.</p>
    </div>
</div>

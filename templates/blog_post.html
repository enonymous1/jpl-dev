<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ post.title }} — Justin P. Lyons</title>
    <meta name="description" content="{{ post.summary }}">
    <meta property="og:title" content="{{ post.title }} — Justin P. Lyons">
    <meta property="og:description" content="{{ post.summary }}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ site_url }}{{ post.url_path }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet"
          integrity="sha384-DeN988K4Vg0cDrUgVHjrVM0+ogMrXsv0AZYIH40/9VGpjC7zi8TFGdnPwL1EkU/T" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile-card.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/checklist.css') }}">
    <link rel="alternate" type="application/rss+xml" title="Justin P. Lyons — Blog" href="{{ url_for('feed') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/vcard.css') }}?v=20261028-5">
    <script>
        (function() {
            try {
                const saved = window.localStorage.getItem('jpl_dev_global_theme');
                const sys = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', saved || sys);
            } catch (e) {}
        })();
    </script>
</head>
<body class="vcard-page">
<div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="vcard-layout">
        {% include "_vcard_sidebar.html" %}

        <div class="vcard-main">
            <nav class="vcard-tabs" aria-label="Portfolio sections">
                <a href="{{ url_for('index') }}#about">About</a>
                <a href="{{ url_for('index') }}#projects">Projects</a>
                <a href="{{ url_for('index') }}#blog" aria-current="page">Blog</a>
                <a href="{{ url_for('index') }}#contact">Contact</a>
            </nav>
            <article class="blog-post">
                <h1 class="blog-post-title">{{ post.title }}</h1>
                <p class="blog-post-meta">{{ post.date_label }}{% if post.pinned %} <span class="blog-pinned">Pinned</span>{% endif %}</p>
                <div class="blog-post-body">{{ post.html | safe }}</div>
                {% if post.tags %}
                <p class="blog-tags">{% for tag in post.tags %}<span class="badge-theme">{{ tag }}</span>{% endfor %}</p>
                {% endif %}
            </article>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='global-theme.js') }}"></script>
<script src="{{ url_for('static', filename='avatar-easter-egg.js') }}"></script>
</body>
</html>

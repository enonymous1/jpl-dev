        <aside class="vcard-sidebar">
            <div class="vcard-profile">
                <button type="button" class="vcard-avatar-btn" id="avatar-easter-egg">
                    <img src="{{ url_for('static', filename=about.profile_image) }}"
                         alt="Profile photo of Justin P. Lyons"
                         class="vcard-avatar">
                </button>
                <div class="vcard-bubble-wrap"><p class="vcard-bubble" id="avatar-quip" role="status"></p></div>
                <h2>{{ about.name }}</h2>
                <div class="vcard-badges">
                    {% for badge in about.badges %}
                    <button type="button" class="badge-theme glossary-pill {% if loop.first %}badge-primary{% endif %}" data-glossary-term="{{ badge }}" aria-haspopup="dialog">{{ badge }}</button>
                    {% endfor %}
                </div>
            </div>
            <hr class="vcard-divider">
            <ul class="vcard-contact">
                <li><i class="bi bi-github"></i> <a href="https://github.com/{{ github_user }}" target="_blank" rel="noopener noreferrer">{{ github_user }}</a></li>
                <li><i class="bi bi-linkedin"></i> <a href="https://linkedin.com/in/{{ linkedin_slug }}" target="_blank" rel="noopener noreferrer">{{ linkedin_slug }}</a></li>
                <li><i class="bi bi-envelope"></i> <a href="mailto:{{ contact_email }}">{{ contact_email }}</a></li>
                <li><i class="bi bi-geo-alt"></i> Fredericksburg, VA</li>
            </ul>
            <div class="vcard-sidebar-actions">
                <span class="vcard-tooltip-wrap">
                    <a href="{{ url_for('retro') }}" class="repo-btn" aria-label="View the retro skin: the same portfolio in a MySpace-style throwback look" aria-describedby="retro-tooltip">'My' Space</a>
                    <span class="vcard-tooltip" id="retro-tooltip" role="tooltip">Same portfolio, same information &mdash; in a MySpace-style throwback skin. The clean site stays the default.</span>
                </span>
                <button id="theme-toggle" type="button" class="repo-btn" title="Toggle theme" aria-label="Toggle theme" aria-pressed="false">
                    <i class="bi bi-sun theme-icon-light"></i><i class="bi bi-moon theme-icon-dark hidden"></i> Theme
                </button>
            </div>
            <div class="vcard-social" aria-label="Social links">
                <a href="https://github.com/{{ github_user }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="bi bi-github"></i></a>
                <a href="https://linkedin.com/in/{{ linkedin_slug }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
                <a href="mailto:{{ contact_email }}" aria-label="Email"><i class="bi bi-envelope"></i></a>
            </div>
        </aside>
